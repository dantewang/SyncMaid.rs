[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Dante Wang"]
repository = "https://github.com/dantewang/SyncMaid.rs"

[workspace.dependencies]
syncmaid-core = { path = "crates/core" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Release builds are what users get: one folder, no runtime prerequisite.
# `panic` stays at the default `unwind` — gpui relies on catch_unwind.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
