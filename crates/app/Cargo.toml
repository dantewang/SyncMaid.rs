[package]
name = "syncmaid"
description = "SyncMaid — one-way file sync for Windows, done for you."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "syncmaid"
path = "src/lib.rs"

[[bin]]
name = "SyncMaid-rs"
path = "src/main.rs"

[dependencies]
syncmaid-core.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# GPUI and gpui-base, and nothing styled: the components the app draws are its own, in
# `src/ui`. No features — `component` would bring gpui-component back, `assets` its icon bundle,
# and the rest are tree-sitter grammars.
gpui-kit = { version = "0.9.0", default-features = false }
raw-window-handle = "0.6.2"
flume = "0.12.0"
# `include-exclude` for the `#[include]` filters in `assets.rs`.
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
# No default features: the log is a file with its own format, so `ansi` has nothing to colour,
# and `tracing-log` only matters to `init()`, which `logging::install` does not call.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
chrono.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# The tray lives on its own thread with its own win32 message pump; ShowWindow is what keeps
# a hidden window (and therefore gpui's message loop) alive instead of destroying it.
tray-icon = { version = "0.26", default-features = false }
windows-registry = "0.6.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Threading",
    # ShellExecuteW: "open the log file" has to land in the user's own editor, not one we pick.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
serde_json.workspace = true
winresource = "0.1"

[dev-dependencies]
notify = "8.2.0"
syncmaid-core = { workspace = true, features = ["testing"] }
tempfile = "3.27.0"





