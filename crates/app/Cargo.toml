[package]
name = "syncmaid"
description = "SyncMaid — one-way file sync for Windows, done for you."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "syncmaid"
path = "src/lib.rs"

[[bin]]
name = "SyncMaid"
path = "src/main.rs"

[dependencies]
syncmaid-core.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

gpui = "0.2.2"
gpui-component = "0.5.1"
raw-window-handle = "0.6.2"
flume = "0.12.0"
rust-embed = "8.12.0"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
chrono.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# The tray lives on its own thread with its own win32 message pump; ShowWindow is what keeps
# a hidden window (and therefore gpui's message loop) alive instead of destroying it.
tray-icon = "0.24"
windows-registry = "0.6.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
notify = "8.2.0"
syncmaid-core = { workspace = true, features = ["testing"] }
tempfile = "3.27.0"


