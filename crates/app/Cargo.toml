[package]
name = "syncmaid"
description = "SyncMaid — one-way file sync for Windows, done for you."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "syncmaid"
path = "src/lib.rs"

[[bin]]
name = "SyncMaid-rs"
path = "src/main.rs"

[dependencies]
syncmaid-core.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# GPUI and gpui-component as one version-matched dependency. `component` only: `assets` would
# embed the library's icon bundle, and every icon the app draws ships in `assets/icons` instead
# (see `assets.rs`). The remaining features are tree-sitter grammars.
gpui-kit = { version = "0.6.1", default-features = false, features = ["component"] }
raw-window-handle = "0.6.2"
flume = "0.12.0"
rust-embed = "8.12.0"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
chrono.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# The tray lives on its own thread with its own win32 message pump; ShowWindow is what keeps
# a hidden window (and therefore gpui's message loop) alive instead of destroying it.
tray-icon = "0.24"
windows-registry = "0.6.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Threading",
    # ShellExecuteW: "open the log file" has to land in the user's own editor, not one we pick.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
serde_json.workspace = true
winresource = "0.1"

[dev-dependencies]
notify = "8.2.0"
syncmaid-core = { workspace = true, features = ["testing"] }
tempfile = "3.27.0"





