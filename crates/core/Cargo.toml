[package]
name = "syncmaid-core"
description = "SyncMaid's UI-free sync engine: model, planner, safe transfer, triggers, persistence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
croner = "3.0.1"
notify = "8.2.0"
# Already linked into the app by GPUI, so a regex filter costs the executable ~4 KB.
regex = "1.13"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
# XXH3-128, which safe_transfer verifies copies with.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(windows)'.dependencies]
# The Recycle Bin (IFileOperation) and the handful of Win32 calls std does not cover:
# volume free space, write-through opens, and directory timestamps.
trash = "5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[features]
# Exposes the in-memory filesystem and its fault-injection switches to downstream test code.
testing = []

[dev-dependencies]
# Self-dependency so the integration tests get the in-memory filesystem and its fault
# switches, which the lib only exposes behind the `testing` feature.
syncmaid-core = { path = ".", features = ["testing"] }
tempfile = "3"
